# PROVIDED: project settings. Every path is relative to the repository root.
# Code reads paths from here, so the project runs on any teammate's machine.

paths:
  raw_dir: data/raw                  # full Kaggle download (never committed)
  sample_dir: data/sample            # the 5,000-applicant working sample (never committed)
  reports_dir: reports               # summaries and metrics written by the code
  split_file: config/split_ids.csv   # DO NOT EDIT: the fixed train/validation split
  metrics_file: reports/metrics.json

seed: 42
sample_size: 5000
chunksize: 500000            # rows read at a time when filtering the large tables
expected_sample_hash: "5f46b5f1e9d9803a0a79844b6b6a3a6ded4e1f6194476ea3c11d3310bfebda2f"   # the instructor's sample; python run.py check compares yours to it

id_col: SK_ID_CURR
target_col: TARGET

# Table name -> CSV file name (same name in data/raw and data/sample).
tables:
  application_train: application_train.csv
  bureau: bureau.csv
  bureau_balance: bureau_balance.csv
  previous_application: previous_application.csv
  POS_CASH_balance: POS_CASH_balance.csv
  installments_payments: installments_payments.csv
  credit_card_balance: credit_card_balance.csv

baseline:
  max_iter: 1000
  class_weight: null
