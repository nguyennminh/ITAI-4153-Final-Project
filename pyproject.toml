# PROVIDED: tool settings for pytest and ruff.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# MLflow uses an old SQLAlchemy option; the warning is about MLflow, not your code.
filterwarnings = [
    "ignore:.*noload.*:DeprecationWarning",
    # Newer Starlette warns about its own test client; not about your code.
    "ignore:Using `httpx` with",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
